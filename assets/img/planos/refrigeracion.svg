  <path d="M70 240V90h220v150" stroke-width="1" stroke-dasharray="5 4"/>
  <!-- Puerta -->
  <rect x="190" y="130" width="70" height="110"/>
  <path d="M250 175v22" stroke-width="3"/>
  <!-- Evaporador -->
  <rect x="90" y="96" width="80" height="26"/>
  <circle cx="110" cy="109" r="8" stroke-width="1.5"/>
  <circle cx="150" cy="109" r="8" stroke-width="1.5"/>
  <path d="M100 130l-6 10M120 130l-6 10M140 130l-6 10M160 130l-6 10" stroke-width="1" stroke-dasharray="2 3"/>
  <!-- Estantes -->
  <path d="M84 170h86M84 200h86M84 230h86" stroke-width="1.5"/>
