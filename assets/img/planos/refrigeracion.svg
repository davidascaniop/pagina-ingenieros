  <rect x="240" y="44" width="80" height="36"/>
  <circle cx="262" cy="62" r="11" stroke-width="1.5"/>
  <path d="M290 54h20M290 62h20M290 70h20" stroke-width="1"/>
  <path d="M240 62h-60v34" stroke-width="1.5"/>
  <path d="M40 240h290" stroke-width="2.5"/>
