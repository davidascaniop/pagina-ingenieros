  <rect x="320" y="120" width="44" height="26" rx="2" stroke-width="1.5"/>
  <text x="342" y="138" fill="#A9C1E0" stroke="none" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">-18 °C</text>
  <path d="M60 262h240M60 256v12M300 256v12" stroke-width="1"/>
  <text x="180" y="282" fill="#A9C1E0" stroke="none" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Cava de congelación</text>
</svg>
